name: Embold Scan - TypeScript

on:
  push:
    branches: [main]
    paths:
      - 'sample_source_code/typescript/**'
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample_source_code/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Jest with Istanbul coverage
        run: npm run test:coverage -- --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: typescript-coverage-report
          path: sample_source_code/typescript/coverage/
          retention-days: 14

  embold-scan:
    needs: test-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embold Scan
        id: embold-scan
        uses: embold/github-action-docker@v2.0.0
        with:
          emboldUrl: https://demo.embold.io/
          emboldToken: ${{ secrets.EMBOLD_TOKEN_DEMO_INST }}
          emboldRepoUid: <REPO_UID_TS>
          repositoryConfigPath: sample_source_code/typescript/repository-configuration.json
          downloadConfig: 'true'
          qualityGate: 'true'
          snapshotLabel: ${{ github.run_number }}

      - name: Check Quality Gate Result
        if: steps.embold-scan.outputs.qualityGateStatus == 'FAILED'
        run: |
          echo "Quality gate failed!"
          exit 1
