name: Embold Scan - Python

on:
  push:
    branches: [main]
    paths:
      - 'sample_source_code/python/**'
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sample_source_code/python/requirements-dev.txt

      - name: Install dev dependencies
        working-directory: sample_source_code/python
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        working-directory: sample_source_code/python
        run: |
          pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage_html \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: sample_source_code/python/coverage_html/
          retention-days: 14

  embold-scan:
    runs-on: ubuntu-latest
    needs: test-coverage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embold Scan
        id: embold-scan
        uses: embold/github-action-docker@v2.0.0
        with:
          emboldUrl: https://demo.embold.io/
          emboldToken: ${{ secrets.EMBOLD_TOKEN_DEMO_INST }}
          emboldRepoUid: <REPO_UID_PYTHON>
          repositoryConfigPath: sample_source_code/python/repository-configuration.json
          downloadConfig: 'true'
          qualityGate: 'true'
          snapshotLabel: ${{ github.run_number }}

      - name: Check Quality Gate Result
        if: steps.embold-scan.outputs.qualityGateStatus == 'FAILED'
        run: |
          echo "Quality gate failed!"
          exit 1
