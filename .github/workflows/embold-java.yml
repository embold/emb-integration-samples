name: Embold Scan - Java

on:
  push:
    branches: [main]
    paths:
      - 'sample_source_code/JAVA/**'
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample_source_code/JAVA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, run tests and generate JaCoCo report
        run: mvn --batch-mode verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage-report
          path: sample_source_code/JAVA/target/site/jacoco/
          retention-days: 14

  embold-scan:
    needs: test-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embold Scan
        id: embold-scan
        uses: embold/github-action-docker@v2.0.0
        with:
          emboldUrl: https://demo.embold.io/
          emboldToken: ${{ secrets.EMBOLD_TOKEN_DEMO_INST }}
          emboldRepoUid: 034560c4e627f02cc243e7d3eddc7d18
          repositoryConfigPath: repository-configuration.json
          downloadConfig: 'true'
          qualityGate: 'true'
          verbose: false
          snapshotLabel: ${{ github.run_number }}

      - name: Check Quality Gate Result
        if: steps.embold-scan.outputs.qualityGateStatus == 'FAILED'
        run: |
          echo "Quality gate failed!"
          exit 1
